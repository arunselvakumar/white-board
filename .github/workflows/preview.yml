name: Preview

# Pull-request previews of Construction Management are built here, not on
# Vercel's builders: its `next build` no longer fits Vercel's 8 GB build
# machine (ADR-0046), the reason production already deploys from the Deploy
# workflow. Whiteboard and the Marketing Site keep Vercel's own previews.
#
# A pull request from a branch of this repository that changes Construction
# Management (turbo's package graph, so @repo/ui or @repo/auth count) is built
# on a GitHub runner against the project's Preview environment, which applies
# migrations to the preview database first, and uploaded to Vercel as
# prebuilt output. The preview is recorded as a GitHub Deployment in
# `preview/construction-management`, so the pull request links to it.
#
# Needs the repository secret VERCEL_TOKEN (Vercel team below).

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The previews share one preview database: one build at a time, oldest
# first, never cancelled midway (it may be applying migrations).
concurrency:
  group: preview-construction-management
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  construction-management:
    name: Preview construction-management
    # Forks and Dependabot get no secrets and a read-only token on
    # pull_request runs; their pull requests are not previewed.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_ORG_ID: team_82vD1GbgjRVfhL7RIgbvJb3O
      VERCEL_PROJECT_ID: prj_UqfGQZmmJ92d6RHb2oXun9aAy8Ky
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          # The base commit too, for turbo's diff.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Is Construction Management affected?
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          affected=$(TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$SHA" \
            bunx turbo ls --affected --output json)
          if jq -e '.packages.items | any(.name == "construction-management")' \
            <<< "$affected" > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Construction Management is unchanged; no preview."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the deployment
        id: record
        if: steps.affected.outputs.build == 'true'
        env:
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          body=$(jq -n --arg ref "$SHA" --arg environment "preview/construction-management" \
            --arg branch "$REF" \
            '{ref: $ref, environment: $environment, auto_merge: false,
              transient_environment: true, production_environment: false,
              required_contexts: [], description: ("Preview of " + $branch)}')
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<< "$body")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress > /dev/null

      # Preview environment variables and project settings (root directory,
      # build command) into .vercel/.
      - name: Pull Vercel settings
        if: steps.affected.outputs.build == 'true'
        run: bunx vercel@63.1.2 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # The project's build command: preview migrations, then the Next build,
      # on this runner.
      - name: Build
        if: steps.affected.outputs.build == 'true'
        run: bunx vercel@63.1.2 build --token="$VERCEL_TOKEN"

      # Vercel refuses any uploaded file over 100 MB; name them before the
      # upload fails without saying which.
      - name: Check output file sizes
        if: steps.affected.outputs.build == 'true'
        run: |
          large=$(find . -path '*/.vercel/output/*' -type f -size +90M -printf '%s %p\n' | sort -rn)
          if [ -n "$large" ]; then
            echo "Files over 90 MB in the build output (Vercel's limit is 100 MB):"
            echo "$large"
            exit 1
          fi

      - name: Deploy the prebuilt output
        id: deploy
        if: steps.affected.outputs.build == 'true'
        run: |
          url=$(bunx vercel@63.1.2 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the deployment
        if: always() && steps.record.outputs.id != ''
        run: |
          state=${{ job.status == 'success' && 'success' || 'failure' }}
          gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.record.outputs.id }}/statuses" \
            -f state="$state" -f environment_url="${{ steps.deploy.outputs.url }}" > /dev/null
