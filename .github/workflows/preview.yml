name: Preview

# Pull-request previews of Construction Management, built on a GitHub runner
# and uploaded to Vercel as prebuilt output (ADR-0046): its `next build` does
# not fit Vercel's 8 GB build machine. Whiteboard and the Marketing Site keep
# Vercel's own previews.
#
# Previews are on request, because every upload counts against Vercel's
# daily file-upload allowance, which production deploys share (ADR-0046). A
# pull request gets a preview when it carries the `preview` label and CI has
# passed on its latest commit: when the label is added to a pull request
# whose CI already passed, and after every later CI pass while the label
# stays. Only branches of this repository are previewed (forks and Dependabot
# get no secrets), and only when Construction Management is affected
# (turbo's package graph, so @repo/ui or @repo/auth count).
#
# The build applies migrations to the preview database first. The preview is
# recorded as a GitHub Deployment in `preview/construction-management`, so
# the pull request links to it.
#
# Needs the repository secret VERCEL_TOKEN (Vercel team below).

on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  deployments: write
  pull-requests: read
  actions: read

jobs:
  plan:
    name: Plan the preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          LABELED_PR: ${{ github.event.pull_request.number }}
          LABELED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          skip() { echo "No preview: $1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" = "pull_request" ]; then
            [ "$LABEL" = "preview" ] || skip "another label ($LABEL) was added"
            pr=$LABELED_PR
            sha=$LABELED_SHA
            runs="repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request"
            ci=$(gh api "$runs" --jq '[.workflow_runs[] | select(.name == "CI" and .status == "completed")]
                | sort_by(.created_at) | last | .conclusion // ""')
            [ "$ci" = "success" ] ||
              skip "CI has not passed on $sha yet; the preview starts when it does"
          else
            [ "$RUN_EVENT" = "pull_request" ] || skip "CI ran for a $RUN_EVENT, not a pull request"
            [ "$RUN_CONCLUSION" = "success" ] || skip "CI did not pass ($RUN_CONCLUSION)"
            [ -n "$RUN_PR" ] || skip "the CI run names no pull request of this repository"
            pr=$RUN_PR
            sha=$RUN_SHA
          fi
          info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
          [ "$(jq -r .state <<< "$info")" = "open" ] || skip "pull request #$pr is not open"
          [ "$(jq -r .head.sha <<< "$info")" = "$sha" ] || skip "$sha is no longer #$pr's latest commit"
          [ "$(jq -r .head.repo.full_name <<< "$info")" = "$GITHUB_REPOSITORY" ] ||
            skip "#$pr comes from a fork"
          [ "$(jq -r .user.login <<< "$info")" != "dependabot[bot]" ] || skip "#$pr is Dependabot's"
          jq -e '.labels | any(.name == "preview")' <<< "$info" > /dev/null ||
            skip "#$pr has no preview label"
          {
            echo "build=true"
            echo "pr=$pr"
            echo "sha=$sha"
            echo "base=$(jq -r .base.sha <<< "$info")"
            echo "ref=$(jq -r .head.ref <<< "$info")"
          } >> "$GITHUB_OUTPUT"
          echo "Previewing #$pr at $sha."

  construction-management:
    name: Preview construction-management
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The previews share one preview database: one build at a time, never
    # cancelled midway (it may be applying migrations). On the build job, not
    # the workflow, so the many CI completions the plan turns away never
    # queue here and push out a requested preview.
    concurrency:
      group: preview-construction-management
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERCEL_ORG_ID: team_82vD1GbgjRVfhL7RIgbvJb3O
      VERCEL_PROJECT_ID: prj_UqfGQZmmJ92d6RHb2oXun9aAy8Ky
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          # The base commit too, for turbo's diff.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Is Construction Management affected?
        id: affected
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          affected=$(TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$SHA" \
            bunx turbo ls --affected --output json)
          if jq -e '.packages.items | any(.name == "construction-management")' \
            <<< "$affected" > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Construction Management is unchanged; no preview."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the deployment
        id: record
        if: steps.affected.outputs.build == 'true'
        env:
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          body=$(jq -n --arg ref "$SHA" --arg environment "preview/construction-management" \
            --arg branch "$REF" \
            '{ref: $ref, environment: $environment, auto_merge: false,
              transient_environment: true, production_environment: false,
              required_contexts: [], description: ("Preview of " + $branch)}')
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<< "$body")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress > /dev/null

      # Preview environment variables and project settings (root directory,
      # build command) into .vercel/.
      - name: Pull Vercel settings
        if: steps.affected.outputs.build == 'true'
        run: bunx vercel@63.1.2 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # The project's build command: preview migrations, then the Next build,
      # on this runner.
      - name: Build
        if: steps.affected.outputs.build == 'true'
        run: bunx vercel@63.1.2 build --token="$VERCEL_TOKEN"

      # Vercel refuses any uploaded file over 100 MB. Next's build trace
      # (diagnostics/trace, over 100 MB for this app) is only for Vercel's
      # build diagnostics, so it stays behind; anything else that large is
      # named before the upload fails without saying which.
      - name: Check output file sizes
        if: steps.affected.outputs.build == 'true'
        run: |
          find . -path '*/.vercel/output/diagnostics' -type d -prune -exec rm -rf {} +
          large=$(find . -path '*/.vercel/output/*' -type f -size +90M -printf '%s %p\n' | sort -rn)
          if [ -n "$large" ]; then
            echo "Files over 90 MB in the build output (Vercel's limit is 100 MB):"
            echo "$large"
            exit 1
          fi

      - name: Deploy the prebuilt output
        id: deploy
        if: steps.affected.outputs.build == 'true'
        run: |
          url=$(bunx vercel@63.1.2 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the deployment
        if: always() && steps.record.outputs.id != ''
        run: |
          state=${{ job.status == 'success' && 'success' || 'failure' }}
          gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.record.outputs.id }}/statuses" \
            -f state="$state" -f environment_url="${{ steps.deploy.outputs.url }}" > /dev/null
