name: Deploy Construction Management

# Production deploys run here, not on Vercel's builders: once CI has passed
# on main, this job builds Construction Management on a GitHub runner and
# uploads the prebuilt output to Vercel. Vercel never compiles (its 8 GB
# build machine ran out of memory on M7), and nothing reaches production
# unless lint, types, unit, HTTP and Storybook tests passed first. Vercel's
# own git deploys of main are switched off in the app's vercel.json.
#
# Needs the repository secret VERCEL_TOKEN (a Vercel access token for the
# team below). The team and project ids are not secret.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, oldest first; never cancel one midway
# (it may be applying migrations).
concurrency:
  group: deploy-construction-management-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_82vD1GbgjRVfhL7RIgbvJb3O
      VERCEL_PROJECT_ID: prj_UqfGQZmmJ92d6RHb2oXun9aAy8Ky
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Production environment variables and project settings (root
      # directory, build command) into .vercel/.
      - name: Pull Vercel settings
        run: bunx vercel@63.1.2 pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Runs the project's build command, scripts/vercel-build.sh: production
      # migrations, then the Next build, here on the runner.
      - name: Build
        run: bunx vercel@63.1.2 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt output
        run: bunx vercel@63.1.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
