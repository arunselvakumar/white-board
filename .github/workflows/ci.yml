name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whiteboard
          POSTGRES_PASSWORD: whiteboard
          POSTGRES_DB: whiteboard
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U whiteboard -d whiteboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI-only values; nothing here is a real secret.
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-anywhere
      BETTER_AUTH_URL: http://localhost:3001
      EMAIL_TRANSPORT: log
      DATABASE_URL: postgresql://whiteboard:whiteboard@localhost:5433/whiteboard
      DATABASE_URL_TEST: postgresql://whiteboard:whiteboard@localhost:5433/whiteboard_test
      DATABASE_URL_ADMIN: postgresql://whiteboard:whiteboard@localhost:5433/whiteboard
      # Construction Management's HTTP tests use their own database (ADR CM-0001).
      CONSTRUCTION_DATABASE_URL_TEST: postgresql://whiteboard:whiteboard@localhost:5433/construction_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Keep this order in sync with the root `ci` script.
      - run: bun run check-versions
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test
      # Creates whiteboard_test and construction_test and applies migrations
      # itself (each app's vitest global setup).
      - run: bun run test:http
      - run: bun run build

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # Whiteboard and Construction Management pin the same Playwright version.
      - name: Install Playwright Chromium
        working-directory: apps/whiteboard
        run: bunx playwright install --with-deps chromium

      - run: bun run test-storybook
