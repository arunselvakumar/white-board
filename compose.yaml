services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Catches every email in development and end-to-end tests: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3 stand-in for Construction Management files (ADR CM-0001), on :9000.
  # Accepts any access key locally; the app creates its bucket on first use.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=9000 -master.volumeSizeLimitMB=256
    ports:
      - "9000:9000"
    volumes:
      - s3_data:/data

volumes:
  postgres_data:
  s3_data:
